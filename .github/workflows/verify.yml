name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/Stockholm

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/verify.ps1 -SkipTests
        shell: pwsh

  tests:
    name: xUnit tests
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-tests'))
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this commit already passed xUnit
        if: github.event_name == 'schedule'
        id: nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api --paginate --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" -f status=completed \
            --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id')
          for run in $runs; do
            passed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '.jobs[] | select(.name == "xUnit tests") | .steps[] | select(.conclusion == "success" and (.name == "Run xUnit suite" or .name == "Run dotnet test MovieApi.slnx --configuration Release")) | .name')
            if [[ -n "$passed" ]]; then
              echo "This commit already passed the full xUnit suite."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
      - uses: actions/checkout@v4
        if: steps.nightly.outputs.skip != 'true'
      - uses: actions/setup-dotnet@v4
        if: steps.nightly.outputs.skip != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Start SQL Server for integration tests
        if: steps.nightly.outputs.skip != 'true'
        shell: bash
        run: |
          password="MovieApi1!$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          docker run -d --name movieapi-sqlserver -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..30}; do
            if docker exec -e SQLCMDPASSWORD="$password" movieapi-sqlserver \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 1 -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "MOVIEAPI_TEST_SQLSERVER=Server=127.0.0.1,1433;User ID=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          docker logs movieapi-sqlserver
          exit 1
      - name: Run xUnit suite
        if: steps.nightly.outputs.skip != 'true'
        run: dotnet test MovieApi.slnx --configuration Release
