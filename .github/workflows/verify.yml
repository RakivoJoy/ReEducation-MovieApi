name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: ${{ hashFiles('*.sln', '*.slnx') != '' }}
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/verify.ps1
        shell: pwsh
        env:
          CI: 'true'
